<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebound</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="header-left">
        <img src="images/icon48.png" alt="Rebound Logo" class="logo">
        <h1>Rebound</h1>
      </div>
      <div class="header-right">
        <button id="powerButton" class="icon-button" title="Toggle extension on/off" aria-label="Toggle extension on/off">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        </button>
      </div>
    </header>
    
    <div class="header-divider"></div>
    
    <div id="mainContent">
      <div class="section">
        <div class="toggle-container">
          <div class="toggle-item">
            <label class="toggle-switch">
              <input type="checkbox" id="warningsEnabled">
              <span class="slider round"></span>
            </label>
            <div class="toggle-label">
              <span>Warning Messages</span>
              <span class="toggle-description">Show warnings for non-preferred content</span>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2><svg class="icon positive-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> I want to see</h2>
        <div class="keyword-container">
          <div id="preferredKeywords" class="keyword-list positive"></div>
        </div>
        
        <h2><svg class="icon negative-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg> I don't want to see</h2>
        <div class="keyword-container">
          <div id="nonPreferredKeywords" class="keyword-list negative"></div>
        </div>
      </div>
      
      <div class="button-container">
        <button id="updatePreferences" class="primary-button">Update Preferences</button>
      </div>
      
      <div class="footer">
        <div class="attribution">
          Made by <a href="https://ahmetdedeler.com" target="_blank" rel="noopener noreferrer">Ahmet</a> | 
          <a href="https://github.com/Ahmet-Dedeler/rebound" target="_blank" rel="noopener noreferrer">
             GitHub
          </a>
        </div>
      </div>
    </div>
    
    <div id="offScreen" class="hidden">
      <div class="off-content">
        <div class="power-icon-large">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        </div>
        <p>Rebound is off.</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
